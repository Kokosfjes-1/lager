<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingen tilgang</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1d2a2f; background: #e6e9e7; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { background: #fff; padding: 2rem; border-radius: 6px; max-width: 32rem; border-left: 10px solid #b3261e; }
    h1 { margin-top: 0; }
    a { color: #1d2a2f; }
  </style>
</head>
<body>
  <main>
    <h1>Du har ikke tilgang til lageret</h1>
    <p id="hvem">Kontoen du er logget inn med har ikke fått tilgang ennå.</p>
    <p>Be den som administrerer lagersystemet om en invitasjon, og åpne lenken du får tilsendt.</p>
    <p><a href="/.auth/logout?post_logout_redirect_uri=/">Logg inn med en annen konto</a></p>
  </main>
  <script>
    fetch("/.auth/me").then((r) => r.json()).then((d) => {
      const bruker = d && d.clientPrincipal && d.clientPrincipal.userDetails;
      if (bruker) document.getElementById("hvem").textContent = "Du er logget inn som " + bruker + ", men denne kontoen har ikke fått tilgang ennå.";
    }).catch(() => {});
  </script>
</body>
</html>
