<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-retning="inn">
  <header class="topp">
    <h1>Lager</h1>
    <div class="bruker">
      <span id="bruker-navn"></span>
      <a id="logg-ut" href="/.auth/logout?post_logout_redirect_uri=/">Logg ut</a>
    </div>
  </header>

  <main>
    <section class="registrering" aria-label="Registrer varer">
      <div class="felter">
        <label class="felt">
          <span>Navn</span>
          <input id="navn" type="text" autocomplete="off" maxlength="100" placeholder="Hvem leverer eller henter">
        </label>
        <label class="felt felt-bred">
          <span>Kommentar</span>
          <input id="kommentar" type="text" autocomplete="off" maxlength="500" placeholder="Levering fra Komplett">
        </label>
        <label class="felt">
          <span>Lokasjon</span>
          <select id="lokasjon"></select>
        </label>
      </div>

      <div class="skannelinje">
        <div class="modus" role="group" aria-label="Retning">
          <button type="button" id="knapp-inn" data-retning="inn" aria-pressed="true">Inn</button>
          <button type="button" id="knapp-ut" data-retning="ut" aria-pressed="false">Ut</button>
        </div>
        <label class="skann">
          <span id="skann-etikett">Skann vare inn</span>
          <input id="skann" type="text" autocomplete="off" spellcheck="false" placeholder="Skann strekkode eller skriv og trykk Enter">
        </label>
      </div>
      <p id="melding" class="melding" role="status" aria-live="polite"></p>
    </section>

    <div class="sok">
      <label for="sok">Søk i alle registreringer</label>
      <input id="sok" type="search" autocomplete="off" spellcheck="false" placeholder="Strekkode, navn, kommentar eller lokasjon">
    </div>

    <section class="lister">
      <div class="liste" data-retning="inn">
        <div class="liste-topp">
          <h2>Inne</h2>
          <span class="antall" id="antall-inn"></span>
          <button type="button" class="csv" data-liste="inn">Last ned CSV</button>
        </div>
        <ol id="liste-inn"></ol>
      </div>
      <div class="liste" data-retning="ut">
        <div class="liste-topp">
          <h2>Ut</h2>
          <span class="antall" id="antall-ut"></span>
          <button type="button" class="csv" data-liste="ut">Last ned CSV</button>
        </div>
        <ol id="liste-ut"></ol>
      </div>
    </section>

    <section class="liste aktivitet" data-retning="alle">
      <div class="liste-topp">
        <h2 id="aktivitet-tittel">Aktivitet</h2>
        <span class="antall" id="antall-aktivitet"></span>
        <button type="button" class="csv" data-liste="aktivitet">Last ned CSV</button>
      </div>
      <p class="forklaring" id="aktivitet-forklaring"></p>
      <ol id="liste-aktivitet"></ol>
    </section>

    <details class="admin" id="admin">
      <summary>Lokasjoner</summary>
      <form id="ny-lokasjon" class="ny-lokasjon">
        <label class="felt">
          <span>Kode</span>
          <input id="ny-kode" type="text" maxlength="30" placeholder="A3" required>
        </label>
        <label class="felt felt-bred">
          <span>Navn</span>
          <input id="ny-navn" type="text" maxlength="100" placeholder="Hylle A3">
        </label>
        <button type="submit">Legg til lokasjon</button>
      </form>
      <ul id="lokasjonsliste" class="lokasjonsliste"></ul>
      <p><a href="/hyllekoder.html" target="_blank" rel="noopener">Skriv ut hyllekoder</a></p>
    </details>
  </main>

  <div id="varsler" class="varsler" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
