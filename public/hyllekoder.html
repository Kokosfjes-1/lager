<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyllekoder</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Semi+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Barlow", system-ui, sans-serif; color: #1d2a2f; margin: 1.5rem; }
    h1 { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; margin: 0 0 0.3rem; }
    .verktoy { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    .verktoy p { margin: 0; color: #5b6a70; }
    button { font: inherit; padding: 0.5rem 1rem; border: 1px solid #1d2a2f; background: #1d2a2f; color: #fff; border-radius: 4px; cursor: pointer; }
    .ark { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.75rem; }
    .etikett { border: 1px dashed #9aa5a1; padding: 0.75rem; text-align: center; break-inside: avoid; }
    .etikett .navn { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-weight: 700; font-size: 1.5rem; }
    .etikett svg { max-width: 100%; height: auto; }
    .modus-inn .navn { color: #1e7a4c; }
    .modus-ut .navn { color: #c95a0c; }
    h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
    @media print {
      body { margin: 0.5cm; }
      .verktoy { display: none; }
    }
  </style>
</head>
<body>
  <div class="verktoy">
    <div>
      <h1>Hyllekoder</h1>
      <p>Skann en hyllekode for å bytte lokasjon. Skann Inn eller Ut for å bytte retning.</p>
    </div>
    <button type="button" onclick="window.print()">Skriv ut</button>
  </div>

  <h2>Retning</h2>
  <div class="ark" id="modus"></div>

  <h2>Lokasjoner</h2>
  <div class="ark" id="ark"></div>

  <script src="jsbarcode.min.js"></script>
  <script>
    function etikett(navn, kode, klasse) {
      const div = document.createElement("div");
      div.className = "etikett " + (klasse || "");
      const n = document.createElement("div");
      n.className = "navn";
      n.textContent = navn;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      div.append(n, svg);
      JsBarcode(svg, kode, { format: "CODE128", height: 60, fontSize: 14, margin: 6 });
      return div;
    }

    document.getElementById("modus").append(
      etikett("Inn", "MODUS-INN", "modus-inn"),
      etikett("Ut", "MODUS-UT", "modus-ut")
    );

    fetch("/api/lokasjoner")
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((lokasjoner) => {
        const ark = document.getElementById("ark");
        if (!lokasjoner.length) ark.textContent = "Ingen lokasjoner ennå. Legg dem til på lagersiden først.";
        for (const l of lokasjoner) ark.append(etikett(l.navn, "LOK-" + l.kode));
      })
      .catch(() => {
        document.getElementById("ark").textContent = "Klarte ikke å hente lokasjoner. Last inn siden på nytt.";
      });
  </script>
</body>
</html>
